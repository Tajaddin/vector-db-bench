[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-db-bench"
version = "0.1.0"
description = "Reproducible head-to-head benchmark of vector DB backends on QPS, recall@10, p99 latency, and memory footprint."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tajaddin Gafarov", email = "gafarovtajaddin@gmail.com" }]
keywords = ["vector-db", "rag", "faiss", "chroma", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.26",
    "psutil>=5.9",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]
chroma = ["chromadb>=0.5"]
qdrant = ["qdrant-client>=1.10"]
all = ["faiss-cpu>=1.8", "chromadb>=0.5"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Tajaddin/vector-db-bench"
Repository = "https://github.com/Tajaddin/vector-db-bench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
